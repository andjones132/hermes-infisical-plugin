name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch pinned hermes-agent
        run: scripts/fetch-hermes.sh
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage gate
        run: >
          python -m pytest tests/
          --cov=infisical_plugin --cov-report=term-missing
          --cov-fail-under=80
